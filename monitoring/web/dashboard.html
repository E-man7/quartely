<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartely Trader</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1b1f24; --muted: #667085; --line: #e4e7ec;
    --good: #12805c; --warn: #b7791f; --bad: #c0362c; --info: #2f6fdb; --track: #eceff3;
    --good-bg: #e7f6ef; --warn-bg: #fdf3e1; --bad-bg: #fdecea; --info-bg: #e8f0fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --ink: #e6e9ee; --muted: #8b95a5; --line: #262c35;
      --good: #3ccf91; --warn: #f0b44c; --bad: #f2685c; --info: #6ea2ff; --track: #232932;
      --good-bg: #12291f; --warn-bg: #2d2412; --bad-bg: #321715; --info-bg: #142036;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line);
           background: var(--card); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .b-good { color: var(--good); background: var(--good-bg); }
  .b-warn { color: var(--warn); background: var(--warn-bg); }
  .b-bad  { color: var(--bad);  background: var(--bad-bg); }
  .b-info { color: var(--info); background: var(--info-bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--muted); }
  #updated { color: var(--muted); font-size: 13px; }
  #banner { display: none; margin: 16px 24px 0; padding: 10px 14px; border-radius: 8px; }
  main { padding: 16px 24px 32px; display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); max-width: 1400px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 12px; font-weight: 650; letter-spacing: .08em; color: var(--muted); }
  .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; } .span-12 { grid-column: span 12; }
  @media (max-width: 1100px) { .span-4, .span-8, .span-6 { grid-column: span 12; } }
  .big { font-size: 28px; font-weight: 700; line-height: 1.15; }
  .sub { color: var(--muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin-top: 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 120px; align-items: center; gap: 12px; margin: 10px 0; }
  .track { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .bar-row .lbl { text-align: right; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  td.r, th.r { text-align: right; }
  .empty { color: var(--muted); padding: 8px 0; }
  .alloc-track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .alloc-fill { height: 100%; background: var(--info); }
  svg.spark { width: 100%; height: 90px; display: block; margin-top: 12px; }
  .sys { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .sys div { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<header>
  <h1>Quartely Trader</h1>
  <span id="mode" class="badge b-info">—</span>
  <span class="spacer"></span>
  <span id="conn"><span class="dot"></span><span id="conn-text">connecting…</span></span>
  <span id="updated"></span>
</header>
<div id="banner"></div>
<main>
  <section class="card span-4">
    <h2>REGIME</h2>
    <div class="big" id="regime-label">—</div>
    <div class="sub" id="regime-strategy"></div>
    <dl class="kv num">
      <dt>Probability</dt><dd id="regime-prob">—</dd>
      <dt>Stability</dt><dd id="regime-stab">—</dd>
      <dt>Flicker</dt><dd id="regime-flicker">—</dd>
      <dt>State</dt><dd id="regime-state">—</dd>
    </dl>
  </section>

  <section class="card span-8">
    <h2>PORTFOLIO</h2>
    <div style="display:flex; gap:32px; flex-wrap:wrap; align-items:flex-end">
      <div><div class="sub">Equity</div><div class="big num" id="equity">—</div></div>
      <div><div class="sub">Daily P&amp;L</div><div class="big num" id="daily">—</div></div>
      <div style="min-width:160px"><div class="sub">Allocation <span class="num" id="alloc">—</span></div>
        <div class="alloc-track"><div class="alloc-fill" id="alloc-fill" style="width:0"></div></div></div>
      <div><div class="sub">Leverage</div><div class="big num" id="lev">—</div></div>
    </div>
    <svg class="spark" id="spark" viewBox="0 0 600 90" preserveAspectRatio="none" aria-label="Equity this session"></svg>
    <div class="sub" id="spark-note" style="font-size:12px"></div>
  </section>

  <section class="card span-6">
    <h2>RISK STATUS</h2>
    <div id="risk-bars"></div>
    <div class="sub" style="margin-top:8px">Circuit breaker: <span id="breaker" class="badge b-good">—</span></div>
  </section>

  <section class="card span-6">
    <h2>SYSTEM</h2>
    <div class="sys num" id="system"></div>
  </section>

  <section class="card span-12">
    <h2>POSITIONS</h2>
    <table class="num"><thead><tr>
      <th>Symbol</th><th>Side</th><th class="r">Price</th><th class="r">P&amp;L</th><th class="r">Stop</th><th class="r">Held</th>
    </tr></thead><tbody id="positions"></tbody></table>
  </section>

  <section class="card span-12">
    <h2>RECENT SIGNALS</h2>
    <table class="num"><thead><tr>
      <th>Time</th><th>Symbol</th><th>Action</th><th>Reason</th><th>Orders</th>
    </tr></thead><tbody id="signals"></tbody></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmtMoney = (x, signed) => x == null ? "—" :
  (signed ? (x >= 0 ? "+" : "−") : (x < 0 ? "−" : "")) + "$" +
  Math.abs(x).toLocaleString(undefined, {maximumFractionDigits: Math.abs(x) >= 1000 ? 0 : 2});
const fmtPct = (x, signed, d = 2) => x == null ? "—" : (signed && x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const dash = (x) => x == null ? "—" : x;
let refreshMs = 5000, lastUpdated = null, failures = 0;

function setText(id, text, cls) {
  const el = $(id); el.textContent = text;
  if (cls !== undefined) el.className = cls;
}
function cell(row, text, cls) {
  const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; row.appendChild(td); return td;
}
function emptyRow(tbody, cols, text) {
  const tr = document.createElement("tr"); const td = cell(tr, text, "empty"); td.colSpan = cols; tbody.appendChild(tr);
}
function level(frac) { return frac < 0.5 ? "good" : frac < 0.8 ? "warn" : "bad"; }

function riskBar(name, used, limit) {
  const row = document.createElement("div"); row.className = "bar-row num";
  const label = document.createElement("div"); label.textContent = name; label.className = "sub";
  const track = document.createElement("div"); track.className = "track";
  const fill = document.createElement("div"); fill.className = "fill";
  const frac = used == null || !limit ? 0 : Math.max(0, Math.min(used / limit, 1));
  fill.style.width = (frac * 100).toFixed(1) + "%";
  fill.style.background = `var(--${level(frac)})`;
  track.appendChild(fill);
  const value = document.createElement("div"); value.className = "lbl";
  value.textContent = used == null ? "—" : `${(used * 100).toFixed(1)}% / ${(limit * 100).toFixed(0)}% ` +
    (frac < 0.5 ? "✅" : frac < 1 ? "⚠️" : "❌");
  row.append(label, track, value);
  return row;
}

function spark(history) {
  const svg = $("spark"); svg.replaceChildren();
  if (history.length < 2) { setText("spark-note", "Equity chart fills in as bars arrive while this page's server runs."); return; }
  const ys = history.map(p => p[1]); const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const pts = ys.map((y, i) => `${(i / (ys.length - 1) * 600).toFixed(1)},${(84 - (y - lo) / span * 78).toFixed(1)}`).join(" ");
  const ns = "http://www.w3.org/2000/svg";
  const line = document.createElementNS(ns, "polyline");
  line.setAttribute("points", pts); line.setAttribute("fill", "none"); line.setAttribute("stroke-width", "2");
  line.setAttribute("stroke", ys[ys.length - 1] >= ys[0] ? "var(--good)" : "var(--bad)");
  line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(line);
  setText("spark-note", `${fmtMoney(lo)} – ${fmtMoney(hi)} over ${history.length} samples since ${history[0][0].replace("T", " ")}`);
}

function render(data) {
  const s = data.status || {};
  const r = s.regime || {}, p = s.portfolio || {}, risk = s.risk || {}, sys = s.system || {};
  refreshMs = (data.refresh_seconds || 5) * 1000;

  const banner = $("banner");
  if (!s.updated) {
    banner.style.display = "block"; banner.className = "b-warn";
    banner.textContent = "No running instance found yet. Start one with: python main.py --dry-run";
  } else if (String(s.updated).includes("stale")) {
    banner.style.display = "block"; banner.className = "b-bad";
    banner.textContent = "Status is stale: the trading process may have stopped. " + s.updated;
  } else { banner.style.display = "none"; }

  const mode = sys.mode || "—";
  setText("mode", mode, "badge " + (mode === "LIVE" ? "b-bad" : mode === "PAPER" ? "b-good" : "b-info"));
  lastUpdated = s.updated ? new Date(String(s.updated).split(" ")[0]) : null;

  setText("regime-label", r.label || "No signal yet");
  setText("regime-strategy", r.strategy ? r.strategy.replace("Strategy", "") : "");
  setText("regime-prob", fmtPct(r.probability, false, 0));
  setText("regime-stab", r.stability_bars == null ? "—" : `${r.stability_bars} bars`);
  setText("regime-flicker", r.flicker_rate == null ? "—" : `${r.flicker_rate} / ${dash(r.flicker_window)}`);
  const state = r.flickering ? ["Uncertain (flickering)", "badge b-warn"] :
                r.confirmed === false ? ["Pending confirmation", "badge b-warn"] :
                r.confirmed ? ["Confirmed", "badge b-good"] : ["—", ""];
  setText("regime-state", state[0], state[1]);

  setText("equity", fmtMoney(p.equity));
  setText("daily", p.daily_pnl == null ? "—" : `${fmtMoney(p.daily_pnl, true)} (${fmtPct(p.daily_pnl_pct, true)})`,
          "big num " + ((p.daily_pnl || 0) >= 0 ? "pos" : "neg"));
  setText("alloc", fmtPct(p.allocation, false, 0));
  $("alloc-fill").style.width = Math.min(100, Math.max(0, (p.allocation || 0) * 100 / 1.25)) + "%";
  setText("lev", p.leverage == null ? "—" : p.leverage.toFixed(2) + "x");
  spark(data.history || []);

  $("risk-bars").replaceChildren(
    riskBar("Daily DD", risk.daily_dd, risk.daily_limit ?? 0.03),
    riskBar("Weekly DD", risk.weekly_dd, risk.weekly_limit ?? 0.07),
    riskBar("From peak", risk.peak_dd, risk.peak_limit ?? 0.10));
  const br = risk.breaker || "—";
  setText("breaker", br.toUpperCase(), "badge " + (br === "normal" ? "b-good" : "b-bad"));

  const sysEl = $("system"); sysEl.replaceChildren();
  const item = (label, ok, extra) => {
    const d = document.createElement("div");
    const b = document.createElement("span");
    b.className = "badge " + (ok == null ? "b-info" : ok ? "b-good" : "b-bad");
    b.textContent = ok == null ? "?" : ok ? "OK" : "DOWN";
    const t = document.createElement("span"); t.textContent = label + (extra ? " " + extra : "");
    d.append(t, b); sysEl.appendChild(d);
  };
  item("Data feed", sys.data_ok);
  item("Alpaca API", sys.api_ok, sys.api_latency_ms == null ? "" : `${Math.round(sys.api_latency_ms)} ms`);
  const hmm = document.createElement("div");
  hmm.textContent = "HMM model: " + (sys.hmm_age_days == null ? "—" : `${sys.hmm_age_days}d old`);
  sysEl.appendChild(hmm);

  const pos = $("positions"); pos.replaceChildren();
  (s.positions || []).forEach(x => {
    const tr = document.createElement("tr");
    cell(tr, x.symbol); cell(tr, x.side || "LONG"); cell(tr, fmtMoney(x.price), "r");
    cell(tr, fmtPct(x.pnl_pct, true, 1), "r " + ((x.pnl_pct || 0) >= 0 ? "pos" : "neg"));
    cell(tr, x.stop ? fmtMoney(x.stop) : "none", "r"); cell(tr, x.holding || "—", "r");
    pos.appendChild(tr);
  });
  if (!(s.positions || []).length) emptyRow(pos, 6, "Flat: no open positions");

  const sig = $("signals"); sig.replaceChildren();
  (s.signals || []).slice(0, 10).forEach(x => {
    const tr = document.createElement("tr");
    cell(tr, x.time || ""); cell(tr, x.symbol || ""); cell(tr, x.action || "");
    cell(tr, x.reason || "", "sub"); cell(tr, (x.orders || []).join(", "), "sub");
    sig.appendChild(tr);
  });
  if (!(s.signals || []).length) emptyRow(sig, 5, "No signals this session yet");
}

function tickAge() {
  if (!lastUpdated || isNaN(lastUpdated)) { setText("updated", ""); return; }
  const secs = Math.max(0, Math.round((Date.now() - lastUpdated.getTime()) / 1000));
  setText("updated", secs < 90 ? `updated ${secs}s ago` : `updated ${Math.round(secs / 60)} min ago`);
}

async function poll() {
  try {
    const res = await fetch("/api/status", {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    failures = 0;
    document.querySelector("#conn .dot").style.background = "var(--good)";
    setText("conn-text", "connected");
  } catch (e) {
    failures += 1;
    document.querySelector("#conn .dot").style.background = "var(--bad)";
    setText("conn-text", "dashboard server unreachable");
  }
  setTimeout(poll, refreshMs);
}
poll();
setInterval(tickAge, 1000);
</script>
</body>
</html>
